<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520" fill="none" role="img" aria-label="Maskot studio iklan Rizka Adsens">
  <defs>
    <linearGradient id="hair" x1="120" y1="100" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3D6A63"/>
      <stop offset=".55" stop-color="#2A4A45"/>
      <stop offset="1" stop-color="#17332E"/>
    </linearGradient>
    <linearGradient id="skin" x1="150" y1="130" x2="270" y2="290" gradientUnits="userSpaceOnUse">
