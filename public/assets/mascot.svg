      <stop offset="1" stop-color="#E9A982"/>
    </linearGradient>
    <linearGradient id="overall" x1="160" y1="320" x2="270" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#88A58C"/>
      <stop offset=".5" stop-color="#66836B"/>
      <stop offset="1" stop-color="#496450"/>
    </linearGradient>
    <linearGradient id="cream" x1="160" y1="290" x2="260" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#E9E0CF"/>
    </linearGradient>
    <linearGradient id="scarf" x1="170" y1="275" x2="260" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E98064"/>
      <stop offset="1" stop-color="#B94E38"/>
