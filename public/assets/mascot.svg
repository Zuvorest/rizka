    <radialGradient id="iris" cx="0" cy="0" r="1" gradientTransform="translate(176 205) rotate(90) scale(25 17)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#69A79C"/>
      <stop offset=".55" stop-color="#2D6A63"/>
      <stop offset="1" stop-color="#123B38"/>
    </radialGradient>
    <radialGradient id="cheek" cx="0" cy="0" r="1" gradientTransform="translate(148 238) rotate(90) scale(12 22)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EE8E7C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#EE8E7C" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
